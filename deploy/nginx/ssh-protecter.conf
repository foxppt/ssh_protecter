# Replace the domain and certificate paths; Go must listen only on 127.0.0.1:8080.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ssh-auth.example.com;

    ssl_certificate /etc/letsencrypt/live/ssh-auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh-auth.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Overwrite incoming headers instead of appending untrusted client values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
}
