ssh:
  ports: [22]
  protect_ipv4: true
  protect_ipv6: true
  permanent_allow_ips: []
authorization:
  duration: 5m
verification:
  failure_window: 1h
  max_failures: 5
  ban_duration: 24h
http:
  mode: reverse_proxy
  listen: 127.0.0.1:8080
  tls_cert_file: ""
  tls_key_file: ""
  trusted_proxies: [127.0.0.1/32]
storage:
  path: /var/lib/ssh-protecter/state.db
clock:
  require_sync: true
  max_skew: 2s
